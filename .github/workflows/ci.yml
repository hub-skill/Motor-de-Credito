name: CI

on:
  push:
    branches: [dev, staging]
  pull_request:
    branches: [dev, staging]

permissions:
  contents: read

jobs:
  verificacoes:
    name: verificacoes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências (versões do uv.lock)
        run: uv sync --frozen

      - name: Lint e formatação (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check app tests

      - name: Tipos (mypy estrito)
        run: uv run mypy app

      # Sem bancos: os repositórios reais ficam para "pytest -m bancos", rodado localmente.
      - name: Testes (pytest)
        run: uv run pytest

      - name: Segurança do código (bandit)
        run: uv run bandit -q -r app

      - name: Vulnerabilidades nas dependências (pip-audit)
        run: uv run pip-audit
