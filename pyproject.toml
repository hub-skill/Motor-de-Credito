[project]
name = "motor-credito"
version = "0.1.0"
description = "Motor de crédito – triagem de CPF/CNPJ nas listas de sanções e PEP da CGU"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.36",
  "gunicorn>=22",
  "uvicorn-worker>=0.2",
  "pydantic-settings>=2.4",
  "slowapi>=0.1.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "oracledb>=2.0",
  "python-dotenv>=1.0",
  "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["banco"]  # scripts de carga/administração, fora da API

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # S608: SQL dos testes de banco vem de constantes
# Nomes de tabela vêm de constantes internas, nunca da entrada; os valores usam bind variables.
"app/repositorios/*.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["bancos: testes contra os bancos reais (PostgreSQL e Oracle); rode com -m bancos"]
# Sem bancos (padrão/CI): falhas de banco simuladas com porta fechada (tests/falhas), mínimo 90% (hoje: 94%).
# Completo, com os bancos reais: pytest -m "bancos or not bancos" --cov-fail-under=95  (hoje: 99%)
addopts = "-m 'not bancos' --cov=app --cov-report=term-missing --cov-fail-under=90"
